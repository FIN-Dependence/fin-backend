services:
  mysql:
    image: mysql:8.4
    container_name: findependence-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: findependence
      MYSQL_USER: findependence
      MYSQL_PASSWORD: findependence-local
      MYSQL_ROOT_PASSWORD: root-local-only
      TZ: Asia/Seoul
    ports:
      - "3307:3306"
    volumes:
      - findependence_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot-local-only"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  findependence_mysql:
