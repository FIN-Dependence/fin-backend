server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/findependence;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null

findependence:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:4173}
  llm:
    enabled: ${LLM_ENABLED:false}
    base-url: ${LLM_BASE_URL:http://localhost:1234/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:phi-4-mini-instruct}
    temperature: ${LLM_TEMPERATURE:0.2}
  rag:
    enabled: ${RAG_ENABLED:false}
    search-url: ${RAG_SEARCH_URL:http://localhost:8000}
    timeout-ms: ${RAG_TIMEOUT_MS:5000}
    official-results: ${RAG_OFFICIAL_RESULTS:3}
    dialogue-results: ${RAG_DIALOGUE_RESULTS:2}

  
    
